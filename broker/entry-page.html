<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Credential entry</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #f5f5f7; --card: #fff; --muted: #6e6e73;
          --line: #d2d2d7; --accent: #0a5cd5; --warn: #9a5b00; --ok: #1a7f37;
          --warn-bg: #fdf3e1; --ok-bg: #e6f4ea; --bad: #b42318; --bad-bg: #fdecea; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --bg: #1c1c1e; --card: #2c2c2e; --muted: #a1a1a6; --line: #48484a;
            --accent: #5ea0ff; --warn: #f0b04a; --ok: #4ac26b; --warn-bg: #3a2e1a; --ok-bg: #1d3424; --bad: #ff8a80; --bad-bg: #3d1f1d; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  img { max-width: 100%; height: auto; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0.5rem 0 1rem; }
  h2 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
       padding: 16px; margin: 0 0 12px; }
  .intro { color: var(--muted); margin: -0.5rem 0 0; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .name { font-weight: 600; font-size: 1.05rem; font-family: ui-monospace, Menlo, monospace;
          overflow-wrap: anywhere; }
  .age { color: var(--muted); font-size: 0.875rem; white-space: nowrap; }
  /* Time left on a request or a link. The digits keep their width while they count down. */
  .timer { font-variant-numeric: tabular-nums; }
  .timer.soon, .timer.over { color: var(--warn); font-weight: 600; }
  .deadline { color: var(--muted); font-size: 0.9rem; margin: 12px 0 0; }
  .meta, .empty { color: var(--muted); font-size: 0.9rem; margin: 4px 0 0; }
  /* The purpose is the agent's own words: set off as a quote, never styled as the page's voice. */
  .purpose { margin: 12px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line);
             overflow-wrap: anywhere; }
  .flag { color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px;
          margin: 8px 0; font-size: 0.9rem; }
  .result { background: var(--card); border-left: 4px solid var(--ok); border-radius: 8px;
            padding: 10px 14px; font-weight: 600; word-break: break-word; }
  label { display: block; margin: 10px 0 4px; }
  input[type=password], input.date, textarea, select { box-sizing: border-box; width: 100%; font: inherit;
         padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--bg); color: var(--fg); }
  textarea { min-height: 8rem; font-family: ui-monospace, Menlo, monospace; }
  button { min-height: 44px; margin-top: 10px; padding: 0 20px; font: inherit; font-weight: 600;
           color: #fff; background: var(--accent); border: 0; border-radius: 10px; }
  /* A link that leaves for a service's own sign-in page, shown as the card's main button. */
  a.button { display: block; box-sizing: border-box; min-height: 44px; margin-top: 12px; padding: 0 20px;
             font-weight: 600; line-height: 44px; text-align: center; text-decoration: none;
             color: #fff; background: var(--accent); border-radius: 10px; }
  @media (min-width: 600px) { a.button { min-width: 11rem; } }
  button.secondary { color: var(--accent); background: transparent; border: 1px solid var(--accent); }
  /* Lesser choices beside or under the main one: put a mark aside, drop a duplicate. */
  button.quiet { color: var(--fg); background: transparent; border: 1px solid var(--line); }
  button.danger { color: var(--bad); background: transparent; border: 1px solid var(--bad); }
  /* Buttons. On a phone each one fills the width, one under the other, the main one first. On a
     wider screen they keep their own width and sit in a row at the right, the main one last. */
  button { width: 100%; }
  .actions { display: flex; flex-direction: column; }
  .actions.main { flex-direction: column-reverse; }
  .actions button.submit { margin-top: 10px; }
  @media (min-width: 600px) {
    button { width: auto; }
    button.submit, button.wide { margin-left: auto; }
    .actions, .actions.main { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; gap: 0 10px; }
    .actions button.submit { margin-left: 0; }
  }
  h2 + .meta { margin: 0 0 10px; }
  /* The value form's button: full width on a phone, at the right on a wider screen. */
  /* Main buttons sit under their field: full width on a phone, left-aligned on a wider screen. */
  button.submit, button.wide { display: block; width: 100%; margin-top: 12px; }
  @media (min-width: 600px) { button.submit, button.wide { width: auto; min-width: 11rem; } }
  /* Route approval: the decision in one sentence, what to check, then the exact limits. */
  .lead { font-size: 1.1rem; margin: 0 0 12px; }
  .id, code { font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
  .id { font-weight: 600; }
  .check { color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 14px;
           margin: 0 0 16px; }
  .spec { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 0 16px; margin: 0 0 20px; }
  .spec div { padding: 12px 0; border-top: 1px solid var(--line); }
  .spec div:first-child { border-top: 0; }
  .spec dt { color: var(--muted); font-size: 0.875rem; }
  .spec dd { margin: 2px 0 0; }
  @media (min-width: 600px) {
    .spec div { display: grid; grid-template-columns: 8rem 1fr; gap: 16px; align-items: baseline; }
    .spec dd { margin: 0; }
  }
  .chip { display: inline-block; margin: 0 6px 4px 0; padding: 1px 8px; border: 1px solid var(--line);
          border-radius: 6px; font: 600 0.8rem/1.6 ui-monospace, Menlo, monospace; }
  .hint { color: var(--muted); font-size: 0.875rem; }
  p.hint { margin: 4px 0 0; }
  input.date, select { min-height: 44px; }
  input.date:disabled { opacity: 0.5; }
  /* On a phone each field has a row of its own, at full width. */
  .expiry { display: flex; flex-direction: column; gap: 4px; }
  label.never { display: inline-flex; align-items: center; gap: 8px; margin: 0; min-height: 44px; cursor: pointer; }
  label.never input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 0.875rem;
          font-weight: 600; background: var(--line); }
  .pill.pending { color: var(--warn); background: var(--warn-bg); }
  .pill.active { color: var(--ok); background: var(--ok-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  /* Confirmation page: each route's tools, grouped by what the server says they do. */
  li .spec { background: none; border: 0; border-radius: 0; padding: 0; margin: 8px 0 0; }
  li .spec div:first-child { border-top: 1px solid var(--line); }
  details.tools { margin: 10px 0 0; border-top: 1px solid var(--line); padding-top: 10px; }
  details.tools summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  details.tools.delete summary { color: var(--warn); }
  .tools ul { margin: 6px 0 0; }
  .tools li { background: none; border: 0; border-radius: 0; margin: 0; padding: 6px 0;
              border-top: 1px solid var(--line); }
  .tools li:first-child { border-top: 0; }
  .tools .hint { display: block; }
  a.back { color: var(--accent); font-weight: 600; }
  /* While a value is stored and checked: an indeterminate bar and what is happening. */
  .working { margin: 12px 0 0; color: var(--muted); font-size: 0.9rem; }
  .working .bar { display: block; position: relative; overflow: hidden; height: 4px; margin-bottom: 8px;
                  border-radius: 2px; background: var(--line); }
  .working .bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 35%;
                         border-radius: 2px; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .working .bar::after { animation: none; width: 100%; opacity: 0.5; } }
  input.code { min-height: 48px; font: 600 1.3rem/1.2 ui-monospace, Menlo, monospace;
               letter-spacing: 0.3em; }
  /* Six one-digit boxes, built by the script below from the single code field. */
  .code-boxes { display: flex; gap: 8px; }
  .code-boxes input { flex: 1; min-width: 0; min-height: 52px; box-sizing: border-box; padding: 0;
                      text-align: center; font: 600 1.4rem ui-monospace, Menlo, monospace;
                      font-variant-numeric: tabular-nums; color: var(--fg); background: var(--card);
                      border: 1px solid var(--line); border-radius: 8px; }
  .code-boxes input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }
  /* On a wider screen the short fields keep a short width, and the box sits beside the date. */
  @media (min-width: 600px) {
    input.date, input.code, select { max-width: 12rem; }
    .expiry { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
    .code-boxes { max-width: 22rem; }
  }
  /* Approval and pairing. From 600px the three controls share one width and one left edge. From
     900px the page widens to two columns: what is asked on the left, and on the right one panel
     with the warning, the time limit, the code and the button, so the decision is in one place. */
  @media (min-width: 600px) {
    .approve > form select, .approve > form button.wide { width: 100%; max-width: 22rem; margin-left: 0; }
  }
  @supports selector(:has(*)) {
    @media (min-width: 900px) {
      main:has(> .approve) { max-width: 60rem; }
      .approve { display: grid; grid-template-columns: minmax(0, 1fr) 23rem; grid-template-rows: auto auto 1fr;
                 grid-template-areas: "lead lead" "what check" "what form"; column-gap: 32px; align-items: start; }
      .approve > p:first-child { grid-area: lead; font-size: 1.25rem; margin: 0 0 20px; max-width: 46rem; }
      .approve > .spec, .approve > img { grid-area: what; margin: 0; }
      .approve > .check { grid-area: check; margin: 0 0 12px; }
      .approve > form { grid-area: form; position: sticky; top: 16px; display: flex; flex-direction: column;
                        padding: 8px 20px 16px; background: var(--card); border: 1px solid var(--line);
                        border-radius: 12px; }
      .approve > form select, .approve > form button.wide, .approve > form .code-boxes { max-width: none; }
      .approve > form button.wide { margin-top: 16px; }
      .approve > form .deadline { order: 1; text-align: center; }
    }
  }
  /* While the value is being stored (the page swaps when the broker answers). */
  button:disabled { opacity: 0.7; }
  .spin { display: none; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
          border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #fff; border-radius: 50%;
          animation: spin 0.8s linear infinite; }
  form.busy .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: rgba(255, 255, 255, 0.4); } }
</style>
</head>
<body>
<main>
<h1>Credential entry</h1>
{{result}}
{{pending}}
</main>
<script>
  // On submit: show the button as busy and refuse a second press. The value still goes
  // with this submission; the button has no name, so disabling it changes nothing sent.
  // A value form's button also says "Saving…": storing takes several seconds, and the spinner
  // alone says nothing to a screen reader or with reduced motion.
  // An authenticator code field becomes six one-digit boxes. Typing moves to the next box,
  // Backspace to the previous one; a pasted or autofilled code fills every box and submits.
  // The digits are copied into the original field, which stays the one that is sent.
  Array.prototype.forEach.call(document.querySelectorAll('input.code'), function (code) {
    var n = 6, boxes = [], group = document.createElement('div');
    group.className = 'code-boxes';
    group.setAttribute('role', 'group');
    group.setAttribute('aria-labelledby', 'code-label');
    function focusAt(i) { var b = boxes[Math.max(0, Math.min(n - 1, i))]; b.focus(); b.select(); }
    function write(i, raw) {
      var d = raw.replace(/\D/g, ''), start = d.length >= n ? 0 : i, k;
      if (raw !== '' && !d) { boxes[i].value = code.value.charAt(i).trim(); return; }
      if (!d) boxes[i].value = '';
      for (k = 0; k < d.length && start + k < n; k++) boxes[start + k].value = d.charAt(k);
      code.value = boxes.map(function (b) { return b.value || ' '; }).join('');
      if (!d) return;
      focusAt(start + d.length);
      if (/^\d{6}$/.test(code.value) && code.form.requestSubmit) code.form.requestSubmit();
    }
    for (var i = 0; i < n; i++) (function (i) {
      var b = document.createElement('input');
      b.type = 'text'; b.inputMode = 'numeric'; b.maxLength = 1;
      b.autocomplete = i === 0 ? 'one-time-code' : 'off';
      b.setAttribute('aria-label', 'Digit ' + (i + 1));
      b.addEventListener('input', function () { write(i, b.value); });
      b.addEventListener('focus', function () { b.select(); });
      b.addEventListener('paste', function (e) { e.preventDefault(); write(i, e.clipboardData.getData('text')); });
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace') {
          e.preventDefault();
          if (b.value) write(i, ''); else if (i > 0) { write(i - 1, ''); focusAt(i - 1); }
        } else if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); focusAt(i - 1); }
        else if (e.key === 'ArrowRight' && i < n - 1) { e.preventDefault(); focusAt(i + 1); }
      });
      boxes.push(b);
      group.appendChild(b);
    })(i);
    code.type = 'hidden';
    code.value = '';
    code.parentNode.insertBefore(group, code);
    document.getElementById('code-label').htmlFor = '';  // the label names the group, not one box
  });
  // "No expiration" turns the date off; a disabled field is not sent.
  document.addEventListener('change', function (e) {
    if (e.target.name !== 'never') return;
    var date = e.target.form.querySelector('input.date');
    if (date) date.disabled = e.target.checked;
  });
  // Time limits. Each .timer carries the seconds that were left when the broker built the page;
  // counting from the page's own start keeps it right even if this device's clock is wrong. At
  // zero the buttons beside it stop working: the broker would refuse them anyway.
  var timers = document.querySelectorAll('.timer[data-left]');
  if (timers.length) {
    var began = performance.now();
    var tick = function () {
      var gone = Math.floor((performance.now() - began) / 1000);
      Array.prototype.forEach.call(timers, function (el) {
        var left = Number(el.getAttribute('data-left')) - gone;
        if (left <= 0) {
          if (el.classList.contains('over')) return;
          el.classList.add('over');
          el.textContent = el.getAttribute('data-over');
          var scope = el.closest('li') || el.closest('form') || document;
          Array.prototype.forEach.call(scope.querySelectorAll('button[type=submit]'), function (b) { b.disabled = true; });
          return;
        }
        var h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60);
        el.classList.toggle('soon', left < 60);
        el.textContent = el.getAttribute('data-lead') + (h ? h + ' h ' + m + ' min' : m + ':' + ('0' + left % 60).slice(-2));
      });
    };
    tick();
    setInterval(tick, 1000);
  }
  document.addEventListener('submit', function (e) {
    var form = e.target, code = form.querySelector('input.code[type=hidden]');
    if (code && !/^\d{6}$/.test(code.value)) {  // a hidden field is not checked by the browser
      e.preventDefault();
      var all = form.querySelectorAll('.code-boxes input');
      (Array.prototype.filter.call(all, function (b) { return !b.value; })[0] || all[0]).focus();
      return;
    }
    if (form.classList.contains('busy')) { e.preventDefault(); return; }  // auto-submit, then a click
    form.classList.add('busy');
    var working = form.querySelector('.working');
    if (working) working.hidden = false;
    var button = e.submitter || form.querySelector('button.submit, button.wide, button[type=submit]');
    if (!button) return;
    button.disabled = true;
    // The value form and the authenticator form both say what is happening; the spinner turns.
    if (button.classList.contains('submit') || button.classList.contains('wide')) button.lastChild.textContent = 'Saving…';
  });
</script>
</body>
</html>
