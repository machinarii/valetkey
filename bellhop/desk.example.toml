# /etc/bellhop/desk.toml on the bellhop machine. Names only: keys and logins stay in their own files.

[desk]
listen = "127.0.0.1:8460"   # plain HTTP; relay_front adds TLS and reports the real caller
identity = "tailscale"      # callers are Tailscale machine names. "address" is for test networks only.
spool = "/var/lib/bellhop"
max_upload_mb = 50          # relay_front buffers request bodies up to 50 MB

# A command-line tool that keeps its login in the desk user's home folder.
[tool.higgsfield]
command = "/usr/local/bin/higgsfield"
callers = ["agent-dev"]
# Only calls that start with one of these are run. Leave out anything that prints, exports or
# changes the login (auth, login, logout, token, config) and anything that reads a file you name.
allow = ["generate", "upload", "model list", "status"]
deny = ["--debug", "--verbose"]   # options refused wherever they appear
timeout = 600

# An MCP server that runs on this machine and holds its own login. The agent machine connects to
# https://<bellhop address>/desk/mcp/local-tool with no key. Add header and value_file (a one-line file,
# owner desk, mode 600) if the local server wants a key on each request.
#
# An MCP server with a fixed key that lives elsewhere does not belong here: give it a broker
# [api.*] route, which keeps the key in the vault.
[mcp.local-tool]
upstream = "http://127.0.0.1:8470/mcp"
callers = ["agent-dev"]

# Test networks without Tailscale: set identity = "address" above and name each caller's address.
# [address]
# "192.0.2.50" = "agent-dev"
