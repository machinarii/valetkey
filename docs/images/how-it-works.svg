<svg xmlns="http://www.w3.org/2000/svg" width="660" height="520" viewBox="0 0 660 520" fill="none" role="img" aria-label="An agent machine that holds no keys sends the broker a request; the broker checks the calling machine, takes the master key from the vault, and fnox adds it on the way to the service. The answer returns without the key. A tool that keeps its own credential runs on the bellhop, which returns only the output.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; paint-order: stroke; stroke: #0D0D0E; stroke-width: 3px; stroke-linejoin: round; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 14s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 14s; }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 11.43% { opacity: 1; } 12.14%, 100% { opacity: 0; } }
    /* m1: the agent calls a route on the broker; the request holds no key */
    @keyframes m1 {
      0%, 2.14% { transform: translate(0, 0); opacity: 0; }
      2.57% { opacity: 1; }
      4.48% { transform: translate(36px, 0px); }
      8.64% { transform: translate(36px, -64px); }
      10.71% { transform: translate(68px, -64px); opacity: 1; }
      11.57%, 100% { transform: translate(68px, -64px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 10.71% { transform: scale(0.4); opacity: 0; } 11% { transform: scale(0.5); opacity: 0.8; } 14.29%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 10.71% { opacity: 0; } 11.29% { opacity: 0.3; } 13.57%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 11.43% { opacity: 0; } 12.14%, 35% { opacity: 1; } 35.71%, 100% { opacity: 0; } }
    /* m2: the broker takes that route's master key from the vault */
    @keyframes m2 {
      0%, 12.86% { transform: translate(0, 0); opacity: 0; }
      13.29% { opacity: 1; }
      23.57% { transform: translate(0px, 72px); opacity: 1; }
      24.43%, 100% { transform: translate(0px, 72px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 23.57% { transform: scale(0.4); opacity: 0; } 23.86% { transform: scale(0.5); opacity: 0.8; } 27.14%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 23.57% { opacity: 0; } 24.14% { opacity: 0.3; } 26.43%, 100% { opacity: 0; } }
    /* m3: fnox puts the key in the request and forwards it */
    @keyframes m3 {
      0%, 25.71% { transform: translate(0, 0); opacity: 0; }
      26.14% { opacity: 1; }
      33.57% { transform: translate(112px, 0px); opacity: 1; }
      34.43%, 100% { transform: translate(112px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 33.57% { transform: scale(0.4); opacity: 0; } 33.86% { transform: scale(0.5); opacity: 0.8; } 37.14%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 33.57% { opacity: 0; } 34.14% { opacity: 0.3; } 36.43%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 35% { opacity: 0; } 35.71%, 55% { opacity: 1; } 55.71%, 100% { opacity: 0; } }
    /* m4: the service answers the broker */
    @keyframes m4 {
      0%, 36.43% { transform: translate(0, 0); opacity: 0; }
      36.86% { opacity: 1; }
      44.29% { transform: translate(-112px, 0px); opacity: 1; }
      45.14%, 100% { transform: translate(-112px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 44.29% { transform: scale(0.4); opacity: 0; } 44.57% { transform: scale(0.5); opacity: 0.8; } 47.86%, 100% { transform: scale(1.4); opacity: 0; } }
    /* m5: the answer reaches the agent without the key */
    @keyframes m5 {
      0%, 45% { transform: translate(0, 0); opacity: 0; }
      45.43% { opacity: 1; }
      47.08% { transform: translate(-32px, 0px); }
      51.23% { transform: translate(-32px, 64px); }
      53.57% { transform: translate(-68px, 64px); opacity: 1; }
      54.43%, 100% { transform: translate(-68px, 64px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 53.57% { transform: scale(0.4); opacity: 0; } 53.86% { transform: scale(0.5); opacity: 0.8; } 57.14%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 53.57% { opacity: 0; } 54.14% { opacity: 0.3; } 56.43%, 100% { opacity: 0; } }
    /* ph4: act 4 */
    @keyframes ph4 { 0%, 56.43% { opacity: 0; } 57.14%, 88.57% { opacity: 1; } 89.29%, 100% { opacity: 0; } }
    /* m6: for a tool with its own login the agent calls the bellhop */
    @keyframes m6 {
      0%, 57.86% { transform: translate(0, 0); opacity: 0; }
      58.29% { opacity: 1; }
      60.38% { transform: translate(36px, 0px); }
      63.47% { transform: translate(36px, 44px); }
      65.71% { transform: translate(68px, 44px); opacity: 1; }
      66.57%, 100% { transform: translate(68px, 44px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 65.71% { transform: scale(0.4); opacity: 0; } 66% { transform: scale(0.5); opacity: 0.8; } 69.29%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 65.71% { opacity: 0; } 66.29% { opacity: 0.3; } 68.57%, 100% { opacity: 0; } }
    /* m7: the bellhop runs the real tool with its login */
    @keyframes m7 {
      0%, 67.86% { transform: translate(0, 0); opacity: 0; }
      68.29% { opacity: 1; }
      75.71% { transform: translate(112px, 0px); opacity: 1; }
      76.57%, 100% { transform: translate(112px, 0px); opacity: 0; }
    }
    @keyframes m7-ring { 0%, 75.71% { transform: scale(0.4); opacity: 0; } 76% { transform: scale(0.5); opacity: 0.8; } 79.29%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m7-glow { 0%, 75.71% { opacity: 0; } 76.29% { opacity: 0.3; } 78.57%, 100% { opacity: 0; } }
    /* m8: only the output comes back; the login stays on the bellhop */
    @keyframes m8 {
      0%, 79.29% { transform: translate(0, 0); opacity: 0; }
      79.71% { opacity: 1; }
      81.53% { transform: translate(-32px, 0px); }
      84.62% { transform: translate(-32px, -44px); }
      87.14% { transform: translate(-68px, -44px); opacity: 1; }
      88%, 100% { transform: translate(-68px, -44px); opacity: 0; }
    }
    @keyframes m8-ring { 0%, 87.14% { transform: scale(0.4); opacity: 0; } 87.43% { transform: scale(0.5); opacity: 0.8; } 90.71%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m8-glow { 0%, 87.14% { opacity: 0; } 87.71% { opacity: 0.3; } 90%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="519" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">valetkey: how it works</text>

  <!-- where the keys and logins live: no agent runs on these machines -->
  <rect x="212" y="88" width="192" height="404" rx="12" fill="none" stroke="#363840" stroke-dasharray="4 4"/>
  <text class="t-zone" x="228" y="110">no agent runs here</text>

  <!-- connectors: drawn before nodes so they sit behind -->
  <g stroke="#363840">
    <path d="M160,376 H188 Q196,376 196,368 V320 Q196,312 204,312 H228"/>
    <path d="M160,400 H188 Q196,400 196,408 V436 Q196,444 204,444 H228"/>
    <line x1="308" y1="208" x2="308" y2="280"/>
    <line x1="388" y1="356" x2="500" y2="356"/>
    <line x1="388" y1="444" x2="500" y2="444"/>
  </g>
  <g fill="#363840">
    <polygon points="222,309 228,312 222,315"/>
    <polygon points="166,373 160,376 166,379"/>
    <polygon points="222,441 228,444 222,447"/>
    <polygon points="166,397 160,400 166,403"/>
    <polygon points="305,274 308,280 311,274"/>
    <polygon points="494,353 500,356 494,359"/>
    <polygon points="394,353 388,356 394,359"/>
    <polygon points="494,441 500,444 494,447"/>
  </g>

  <!-- nodes -->
  <rect x="32" y="356" width="128" height="64" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="46" cy="373.5" r="2.5" fill="#4CF490" class="tick" style="animation-delay:0s"/>
  <text class="t-name" x="56" y="376.5">agent</text>
  <text class="t-desc" x="44" y="392.5">agent machine</text>
  <text class="t-desc" x="44" y="404.5">holds no keys/credentials</text>
  <rect x="228" y="280" width="160" height="106" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="242" cy="297" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="252" y="300">broker</text>
  <text class="t-desc" x="240" y="316">Proxmox VM</text>
  <text class="t-desc" x="240" y="328">checks the calling machine</text>
  <rect x="240" y="340" width="136" height="32" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-small" x="252" y="358">fnox adds the key</text>
  <rect x="228" y="412" width="160" height="64" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="242" cy="429.5" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.05s"/>
  <text class="t-name" x="252" y="432.5">bellhop</text>
  <text class="t-desc" x="240" y="448.5">Proxmox VM</text>
  <text class="t-desc" x="240" y="460.5">runs MCPs/tools, keeps credentials</text>
  <rect x="500" y="324" width="128" height="64" rx="7" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-name" x="512" y="344.5">service API/CLI</text>
  <text class="t-desc" x="512" y="360.5">gets the request</text>
  <text class="t-desc" x="512" y="372.5">with the key added</text>
  <rect x="500" y="412" width="128" height="64" rx="7" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-name" x="512" y="432.5">service MCP/tool</text>
  <text class="t-desc" x="512" y="448.5">run by the bellhop</text>
  <text class="t-desc" x="512" y="460.5">with the tool's credential</text>

  <!-- @motion:elements -->
  <text class="t-tag story" x="28" y="66" text-anchor="start" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · the agent asks, with no key</text>
  <g class="pkt" style="animation-name:m1">
    <circle cx="160" cy="376" r="4" fill="#4CF490"/>
    <text class="t-tag" x="160" y="364" text-anchor="middle" fill="#4CF490">request</text>
  </g>
  <circle cx="228" cy="312" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="228" y="280" width="160" height="106" rx="7" fill="#4CF490" class="glow" style="animation-name:m1-glow"/>
  <text class="t-tag story" x="28" y="66" text-anchor="start" fill="#FBDC8E" style="animation-name:ph2;opacity:0">2 · the broker checks, fnox adds the key</text>
  <g class="pkt" style="animation-name:m2">
    <circle cx="308" cy="208" r="4" fill="#FBDC8E"/>
    <text class="t-tag" x="308" y="196" text-anchor="middle" fill="#FBDC8E">master key</text>
  </g>
  <circle cx="308" cy="280" r="10" fill="none" stroke="#FBDC8E" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="240" y="340" width="136" height="32" rx="6" fill="#FBDC8E" class="glow" style="animation-name:m2-glow"/>
  <g class="pkt" style="animation-name:m3">
    <circle cx="388" cy="356" r="4" fill="#FBDC8E"/>
    <text class="t-tag" x="388" y="344" text-anchor="middle" fill="#FBDC8E">+ key</text>
  </g>
  <circle cx="500" cy="356" r="10" fill="none" stroke="#FBDC8E" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="500" y="324" width="128" height="64" rx="7" fill="#FBDC8E" class="glow" style="animation-name:m3-glow"/>
  <text class="t-tag story" x="28" y="66" text-anchor="start" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · the answer returns, the key does not</text>
  <circle cx="500" cy="356" r="4" fill="#B6C0CF" class="pkt" style="animation-name:m4"/>
  <circle cx="388" cy="356" r="10" fill="none" stroke="#B6C0CF" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <g class="pkt" style="animation-name:m5">
    <circle cx="228" cy="312" r="4" fill="#B6C0CF"/>
    <text class="t-tag" x="228" y="300" text-anchor="middle" fill="#B6C0CF">answer</text>
  </g>
  <circle cx="160" cy="376" r="10" fill="none" stroke="#B6C0CF" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="32" y="356" width="128" height="64" rx="7" fill="#B6C0CF" class="glow" style="animation-name:m5-glow"/>
  <text class="t-tag story" x="28" y="66" text-anchor="start" fill="#02BEFA" style="animation-name:ph4;opacity:0">4 · tools with a login run on the bellhop</text>
  <g class="pkt" style="animation-name:m6">
    <circle cx="160" cy="400" r="4" fill="#4CF490"/>
    <text class="t-tag" x="160" y="388" text-anchor="middle" fill="#4CF490">request</text>
  </g>
  <circle cx="228" cy="444" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <rect x="228" y="412" width="160" height="64" rx="7" fill="#4CF490" class="glow" style="animation-name:m6-glow"/>
  <g class="pkt" style="animation-name:m7">
    <circle cx="388" cy="444" r="4" fill="#02BEFA"/>
    <text class="t-tag" x="388" y="432" text-anchor="middle" fill="#02BEFA">credential</text>
  </g>
  <circle cx="500" cy="444" r="10" fill="none" stroke="#02BEFA" stroke-width="1.5" class="ring" style="animation-name:m7-ring"/>
  <rect x="500" y="412" width="128" height="64" rx="7" fill="#02BEFA" class="glow" style="animation-name:m7-glow"/>
  <g class="pkt" style="animation-name:m8">
    <circle cx="228" cy="444" r="4" fill="#B6C0CF"/>
    <text class="t-tag" x="228" y="432" text-anchor="middle" fill="#B6C0CF">output</text>
  </g>
  <circle cx="160" cy="400" r="10" fill="none" stroke="#B6C0CF" stroke-width="1.5" class="ring" style="animation-name:m8-ring"/>
  <rect x="32" y="356" width="128" height="64" rx="7" fill="#B6C0CF" class="glow" style="animation-name:m8-glow"/>
  <!-- @/motion:elements -->

  <!-- the vault, on top of the moving parts: the master key emerges from under it -->
  <rect x="228" y="144" width="160" height="64" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="242" cy="161.5" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="252" y="164.5">vault</text>
  <text class="t-desc" x="240" y="180.5">Proxmox container</text>
  <text class="t-desc" x="240" y="192.5">every key, encrypted</text>

  <!-- legend: top right corner. Its right edge is 28 px from the frame, as the title is from the
       left, and its first row starts level with the top of the title. -->
  <circle cx="559" cy="32" r="4" fill="#4CF490"/>
  <text class="t-name" x="569" y="36">request</text>
  <circle cx="559" cy="52" r="4" fill="#FBDC8E"/>
  <text class="t-name" x="569" y="56">master key</text>
  <circle cx="559" cy="72" r="4" fill="#02BEFA"/>
  <text class="t-name" x="569" y="76">credential</text>
</svg>
