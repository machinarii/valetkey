  <circle cx="46" cy="333.5" r="2.5" fill="#4CF490" class="tick" style="animation-delay:0s"/>
  <text class="t-name" x="56" y="336.5">agent</text>
  <text class="t-desc" x="44" y="352.5">agent machine</text>
  <text class="t-desc" x="44" y="364.5">holds no keys/credentials</text>
  <rect x="236" y="144" width="140" height="64" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="250" cy="161.5" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="260" y="164.5">vault</text>
  <text class="t-desc" x="248" y="180.5">Proxmox container</text>
  <text class="t-desc" x="248" y="192.5">every key, encrypted</text>
  <rect x="236" y="240" width="140" height="106" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="250" cy="257" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="260" y="260">broker</text>
  <text class="t-desc" x="248" y="276">Proxmox VM</text>
  <text class="t-desc" x="248" y="288">checks the caller's valet key</text>
  <circle cx="360" cy="257" r="4" fill="#A880FF"/>
  <rect x="248" y="300" width="116" height="32" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-small" x="260" y="318">fnox adds the key</text>
  <rect x="236" y="372" width="140" height="64" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="250" cy="389.5" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.05s"/>
