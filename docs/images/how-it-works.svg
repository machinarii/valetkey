<svg xmlns="http://www.w3.org/2000/svg" width="660" height="496" viewBox="0 0 660 496" fill="none" role="img" aria-label="An agent machine that holds no keys sends the broker a key request; the broker checks that the machine's valet key fits the route, takes the master key from the vault, and fnox adds it on the way to the service. The answer returns without the key. A tool that keeps its own credential runs on the bellhop, which returns only the output.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 13s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 13s; }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 12.31% { opacity: 1; } 13.08%, 100% { opacity: 0; } }
    /* m1: the agent calls a route on the broker; the request holds no key */
    @keyframes m1 {
      0%, 2.31% { transform: translate(0, 0); opacity: 0; }
      2.77% { opacity: 1; }
      4.68% { transform: translate(36px, 0px); }
      8.9% { transform: translate(36px, -64px); }
      11.54% { transform: translate(76px, -64px); opacity: 1; }
      12.46%, 100% { transform: translate(76px, -64px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 11.54% { transform: scale(0.4); opacity: 0; } 11.85% { transform: scale(0.5); opacity: 0.8; } 15.38%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 11.54% { opacity: 0; } 12.15% { opacity: 0.3; } 14.62%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 12.31% { opacity: 0; } 13.08%, 31.54% { opacity: 1; } 32.31%, 100% { opacity: 0; } }
    /* vk: the broker checks that the caller's valet key fits this route */
    @keyframes vk { 0%, 11.92% { transform: scale(0.4); opacity: 0; } 12.29% { transform: scale(0.5); opacity: 0.8; } 16.54%, 100% { transform: scale(1.4); opacity: 0; } }
    /* m2: the broker takes that route's master key from the vault */
    @keyframes m2 {
      0%, 13.85% { transform: translate(0, 0); opacity: 0; }
      14.31% { opacity: 1; }
      19.23% { transform: translate(0px, 32px); opacity: 1; }
      20.15%, 100% { transform: translate(0px, 32px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 19.23% { transform: scale(0.4); opacity: 0; } 19.54% { transform: scale(0.5); opacity: 0.8; } 23.08%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 19.23% { opacity: 0; } 19.85% { opacity: 0.3; } 22.31%, 100% { opacity: 0; } }
    /* m3: fnox puts the key in the request and forwards it */
    @keyframes m3 {
      0%, 21.54% { transform: translate(0, 0); opacity: 0; }
      22% { opacity: 1; }
      30% { transform: translate(124px, 0px); opacity: 1; }
      30.92%, 100% { transform: translate(124px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 30% { transform: scale(0.4); opacity: 0; } 30.31% { transform: scale(0.5); opacity: 0.8; } 33.85%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 30% { opacity: 0; } 30.62% { opacity: 0.3; } 33.08%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 31.54% { opacity: 0; } 32.31%, 53.08% { opacity: 1; } 53.85%, 100% { opacity: 0; } }
    /* m4: the service answers the broker */
    @keyframes m4 {
      0%, 33.08% { transform: translate(0, 0); opacity: 0; }
      33.54% { opacity: 1; }
      41.54% { transform: translate(-124px, 0px); opacity: 1; }
      42.46%, 100% { transform: translate(-124px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 41.54% { transform: scale(0.4); opacity: 0; } 41.85% { transform: scale(0.5); opacity: 0.8; } 45.38%, 100% { transform: scale(1.4); opacity: 0; } }
    /* m5: the answer reaches the agent without the key */
    @keyframes m5 {
      0%, 42.31% { transform: translate(0, 0); opacity: 0; }
      42.77% { opacity: 1; }
      44.95% { transform: translate(-40px, 0px); }
      49.16% { transform: translate(-40px, 64px); }
      51.54% { transform: translate(-76px, 64px); opacity: 1; }
      52.46%, 100% { transform: translate(-76px, 64px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 51.54% { transform: scale(0.4); opacity: 0; } 51.85% { transform: scale(0.5); opacity: 0.8; } 55.38%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 51.54% { opacity: 0; } 52.15% { opacity: 0.3; } 54.62%, 100% { opacity: 0; } }
    /* ph4: act 4 */
    @keyframes ph4 { 0%, 54.62% { opacity: 0; } 55.38%, 89.23% { opacity: 1; } 90%, 100% { opacity: 0; } }
    /* m6: for a tool with its own login the agent calls the bellhop */
    @keyframes m6 {
      0%, 56.15% { transform: translate(0, 0); opacity: 0; }
      56.62% { opacity: 1; }
      58.69% { transform: translate(36px, 0px); }
      61.79% { transform: translate(36px, 44px); }
      64.62% { transform: translate(76px, 44px); opacity: 1; }
      65.54%, 100% { transform: translate(76px, 44px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 64.62% { transform: scale(0.4); opacity: 0; } 64.92% { transform: scale(0.5); opacity: 0.8; } 68.46%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 64.62% { opacity: 0; } 65.23% { opacity: 0.3; } 67.69%, 100% { opacity: 0; } }
    /* m7: the bellhop runs the real tool with its login */
    @keyframes m7 {
      0%, 66.92% { transform: translate(0, 0); opacity: 0; }
      67.38% { opacity: 1; }
      75.38% { transform: translate(124px, 0px); opacity: 1; }
      76.31%, 100% { transform: translate(124px, 0px); opacity: 0; }
    }
    @keyframes m7-ring { 0%, 75.38% { transform: scale(0.4); opacity: 0; } 75.69% { transform: scale(0.5); opacity: 0.8; } 79.23%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m7-glow { 0%, 75.38% { opacity: 0; } 76% { opacity: 0.3; } 78.46%, 100% { opacity: 0; } }
    /* m8: only the output comes back; the login stays on the bellhop */
    @keyframes m8 {
      0%, 79.23% { transform: translate(0, 0); opacity: 0; }
      79.69% { opacity: 1; }
      82.05% { transform: translate(-40px, 0px); }
      85.15% { transform: translate(-40px, -44px); }
      87.69% { transform: translate(-76px, -44px); opacity: 1; }
      88.62%, 100% { transform: translate(-76px, -44px); opacity: 0; }
    }
    @keyframes m8-ring { 0%, 87.69% { transform: scale(0.4); opacity: 0; } 88% { transform: scale(0.5); opacity: 0.8; } 91.54%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m8-glow { 0%, 87.69% { opacity: 0; } 88.31% { opacity: 0.3; } 90.77%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="495" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">valetkey: how it works</text>

  <!-- where the keys and logins live: no agent runs on these machines -->
